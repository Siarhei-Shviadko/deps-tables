# Default values for deps-tables.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Secrets declaration
# Precreate them before deploy
# kubectl create secret generic celery-broker-url --from-literal=celery-broker-url=<pyamqp://USERNAME:PASSWORD@RABBITMQ_SERVICE:5672/VHOST>
# kubectl create secret generic celery-backend-url --from-literal=celery-backend-url=<redis://:PASSWORD@REDIS_SERVICE:6379/0>
# kubectl create secret generic aws-credentials --from-literal=aws-access-key-id='<value>' --from-literal=aws-secret-access-key='<value>'
# kubectl create secret generic azure-credentials --from-literal=azure-form-recognizer-api='<value>' --from-literal=azure-form-recognizer-key='<value>'
# kubectl create secret generic keycloak-certs-endpoint --from-literal=keycloak-certs-endpoint='<https://KEYCLOAK_URL/auth/realms/Test/protocol/openid-connect/certs>'
# kubectl create secret generic sentry-dsn-tables-api --from-literal=sentry-dsn='<SENTRY_DSN_TABLES_API>'

secrets:
  aws_credentials:
    secretName: aws-credentials
  azure_credentials:
    secretName: azure-credentials
  gcp_credentials:
    secretName: gcp-credentials
  keycloak_certs_endpoint:
    secretName: keycloak-certs-endpoint
  sentry_dsn:
    secretName: sentry-dsn
  kafka_secrets:
    secretName: kafka-secrets
  common_secret:
    secretName: common-secret
  deps_tables:
    secretName: deps-tables

helm_logs_job:
  serviceAccountName: gitlab-ci
  image:
    path: "/base/kubernetes-helm"
    pullPolicy: Always
    tag: "0.1.1"
  resources: { }

registry: ""

tables:
  replicaCount: 1
  deployStrategy: Recreate
  image:
    path: '/deps-dev-x01/deps-tables'
    pullPolicy: Always
    tag: ""
  imagePullSecrets: 'artifactory'
  podAnnotations: { }
  service:
    type: ClusterIP
    port: 8000
    portname: 'svc-port'
    protocol: TCP
  container:
    port: 8000
    portname: 'cont-port'
    protocol: TCP
  resources: { }
  #  limits:
  #    cpu: 2
  #    memory: 9000Mi
  #  requests:
  #    cpu: 2
  #    memory: 5000Mi
  nodeSelector: { }
  tolerations:
    - key: "tables-service"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  affinity:
    enabled: false
    instance: ""

tables_consumer:
  replicaCount: 1
  deployStrategy: Recreate
  image:
    path: '/deps-dev-x01/deps-tables'
    pullPolicy: Always
    tag: ""
  imagePullSecrets: 'artifactory'
  podAnnotations: { }
  resources: { }
  #  limits:
  #    cpu: 2
  #    memory: 9000Mi
  #  requests:
  #    cpu: 2
  #    memory: 5000Mi
  nodeSelector: { }
  tolerations:
    - key: "tables-service"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  affinity:
    enabled: false
    instance: ""

tables_consumer_settings:
  OCR_VERSION: converter

tables_settings:
  ENV: development
  ## Blob storage
  # File Storage (default)
  BLOB_STORAGE: FILE_STORAGE
  # File Blob storage service
  FILE_STORAGE_URL: http://file-storage-nginx:8000/api/storage/v1/file
  OCR_API_URL: http://ocr:8000/api/ocr/v1/extract-text
  AWS_REGION_NAME: 'eu-central-1'
  AZURE_FORM_RECOGNIZER_API: ''
  AZURE_FORM_RECOGNIZER_KEY: ''
  PROJECT_VERSION: 0.2.0
  PREINIT_DETECTORS: false

  # Gunicorn settings
  ## Number of workers
  WORKERS: 1
  ## Reload worker if any code changes
  RELOAD: false
  ## Level of displayed logs
  LOG_LEVEL: info
  ## Maximum number of requests that worker can handle
  MAX_REQUESTS: 1000
  ## Timeout for one request (in seconds)
  TIMEOUT: 600

  # Sentry settings
  SENTRY_ENABLED: 'false'
  SENTRY_TRACES_SAMPLE_RATE: '1.0'

  ## Set debug to true for local development and running
  DEBUG: false

  # Machine learning models settings
  ENABLE_GPU: false
  # border identification allows to verify that image has at least one table
  # and it means that we can get coordinates of this table
  IDENTIFY_TABLE_BORDERS: true

  # Auth
  AUTH_VERIFY_SSL: false

  ENABLED_DETECTION_ENGINES: '["DEPS_DETECTOR","DEPS_CONVERTER"]'
  PAID_ENGINES_RESTRICTION_ENABLED: "true"
  PRIVILEGED_GROUP: "deps-admins"

  KAFKA_GROUP_ID: 'tables'
  KAFKA_SECURITY_ENABLED: false

  # Azure Service Bus
  ASB_SUBSCRIPTION_STRATEGY: 'no_preparation'
  ASB_TOPIC_NAME: 'deps-topic' 
  message_broker_asb_without_manage_permission: false

helm:
  helm_logs_job_enabled: false

csi:
  csi_default_name: deps-tables
  vault_namespace: 'k8s-dev'
  roleName: 'k8s-dev'
  vaultKubernetesMountPath: 'kubernetes-dev'

secrets_location:
  secrets_default_path: "/mnt/secrets-store"

service_account:
  serviceAccountName: 'deps-develop'

# Enabled vault settings means that secrets are pulled from hashicorp vault server. Turn off this setting by changing true to false if you are using this repo in another project. If you haven't integrated your cluster with vault deploy won't work.
vault_settings:
  enabled: false

vault_enabled:
  env:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: deps-tables
          key: aws-access-key-id
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: deps-tables
          key: aws-secret-access-key
    - name: AZURE_FORM_RECOGNIZER_API
      valueFrom:
        secretKeyRef:
          name: deps-tables
          key: azure-form-recognizer-api
    - name: AZURE_FORM_RECOGNIZER_KEY
      valueFrom:
        secretKeyRef:
          name: deps-tables
          key: azure-form-recognizer-key
    - name: GCP_PROJECT_ID
      valueFrom:
        secretKeyRef:
          name: deps-tables
          key: gcp-project-id
    - name: GCP_LOCATION
      valueFrom:
        secretKeyRef:
          name: deps-tables
          key: gcp-location
    - name: GCP_PROCESSOR_ID
      valueFrom:
        secretKeyRef:
          name: deps-tables
          key: gcp-processor-id
    - name: GCP_API_KEY
      valueFrom:
        secretKeyRef:
          name: deps-tables
          key: gcp-api-key
    - name: AUTH_CERTS_ENDPOINT
      valueFrom:
        secretKeyRef:
          name: deps-tables
          key: keycloak-certs-endpoint
    - name: SENTRY_DSN
      valueFrom:
        secretKeyRef:
          name: deps-tables
          key: sentry-dsn-tables-api
    - name: AUTH_ENABLED
      valueFrom:
        secretKeyRef:
          name: deps-tables
          key: auth-enabled
    - name: MESSAGING_DRIVER
      valueFrom:
        secretKeyRef:
          name: deps-tables
          key: message-broker-driver
    - name: MESSAGE_BROKER_CONNECTION_STRING
      valueFrom:
        secretKeyRef:
          name: deps-tables
          key: message-broker-connection-string

vault_disabled:
  env:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: aws-credentials
          key: aws-access-key-id
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: aws-credentials
          key: aws-secret-access-key
    - name: AZURE_FORM_RECOGNIZER_API
      valueFrom:
        secretKeyRef:
          name: azure-credentials
          key: azure-form-recognizer-api
    - name: AZURE_FORM_RECOGNIZER_KEY
      valueFrom:
        secretKeyRef:
          name: azure-credentials
          key: azure-form-recognizer-key
    - name: GCP_PROJECT_ID
      valueFrom:
        secretKeyRef:
          name: gcp-credentials
          key: gcp-project-id
    - name: GCP_LOCATION
      valueFrom:
        secretKeyRef:
          name: gcp-credentials
          key: gcp-location
    - name: GCP_PROCESSOR_ID
      valueFrom:
        secretKeyRef:
          name: gcp-credentials
          key: gcp-processor-id
    - name: GCP_API_KEY
      valueFrom:
        secretKeyRef:
          name: gcp-credentials
          key: gcp-api-key
    - name: AUTH_CERTS_ENDPOINT
      valueFrom:
        secretKeyRef:
          name: keycloak-certs-endpoint
          key: keycloak-certs-endpoint
    - name: SENTRY_DSN
      valueFrom:
        secretKeyRef:
          name: sentry-dsn
          key: sentry-dsn-tables-api
    - name: AUTH_ENABLED
      valueFrom:
        secretKeyRef:
          name: common-secret
          key: auth-enabled
    - name: MESSAGING_DRIVER
      valueFrom:
        secretKeyRef:
          name: common-secret
          key: message-broker-driver
    - name: MESSAGE_BROKER_CONNECTION_STRING
      valueFrom:
        secretKeyRef:
          name: common-secret
          key: message-broker-connection-string
