[tool.poetry]
name = "deps-tables"
version = "0.1.1"
description = "Table Detection and extraction service"
authors = ["Aliaksei Y <Aliaksei_Y>"]

[tool.poetry.dependencies]
python = "^3.9.7"
torch = "1.8.0"
torchvision = "0.9.0"
detectron2 = { url = "https://dl.fbaipublicfiles.com/detectron2/wheels/cpu/torch1.8/detectron2-0.6%2Bcpu-cp39-cp39-linux_x86_64.whl"}
pydantic = "^1.7.3"
numpy = "^1.25.2"
boto3 = "^1.16.58"
textract-trp = "^0.1.3"
Pillow = "^9.2.0"
scikit-learn = "^0.24.2"
opencv-python-headless = "~4.6"
grpcio = "1.36.1"
fastapi = "^0.63.0"
dependency-injector = "^4.23.1"
python-multipart = "^0.0.5"
gunicorn = "^20.0.4"
uvicorn = "^0.13.4"
uvloop = "^0.15.1"
httptools = "^0.1.1"
sentry-sdk = "^1.1.0"
azure-ai-formrecognizer = "~3.3.0"
deps-message-flow = { path = "../vendors/deps-message-flow/src", extras = ["deps-asb", "deps-kafka", "deps-rabbitmq"], develop = true }
typing-extensions = "~4.7.0"
google-cloud = "^0.34.0"
google-cloud-documentai = "^2.15.0"
more-itertools = "^9.1.0"
Authlib = "^0.15.3"

[tool.poetry.group.dev.dependencies]
mypy = "~0.790"
flake8 = "~6.0.0"
isort = "~5.12.0"
black = "~21.4b2"
pytest = "~7.4.0"
coverage = "^5.4"
pytest-mock = "^3.11.1"
factory-boy = "^3.3.0"
mock = "^5.1.0"
requests-mock = "~1.11.0"
wemake-python-styleguide = "~0.18.0"
bandit = "~1.7.5"
ipdb = "^0.13.11"
wdb = "^3.3.0"
pytest-factoryboy = "2.5.1"
setuptools = "^68.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 130
target-version = ['py39']
exclude = '''
(
    .venv
    | vendors
    | etc
)
'''

