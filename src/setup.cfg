[tool:pytest]
rootdir = /app
cache_dir = /tmp/test_cache/.pytest_cache

filterwarnings =
    ignore::UserWarning
    ignore::FutureWarning
    ignore::DeprecationWarning

[flake8]
ignore=
    # Whitespace before ':'
    E203,
    # Class without a base class
    WPS306,
    # Found `f` string
    WPS305,
    # Remove all docstring rules
    D,
    # Remove bad quotes
    Q000,
    # Found empty comment
    WPS464,
    # Found local folder import
    WPS300,
    # Found `__init__.py` module with logic
    WPS412,
    # Found `else` in a loop without `break`
    WPS500,
    # Found too short name: x
    WPS111,
    # Found function with too much cognitive complexity NEED TO GOOGLE AND SET COGNITIVE
    WPS231,
    # Found incorrectly nested ternary
    WPS509,
    # Found too many imported names from a module
    WPS235,
    # Found string constant over-use
    WPS226,
    # Found a line that starts with a dot
    WPS348,
    # Found multiline conditions
    WPS337,
    # Found incorrect order of methods in a class
    WPS338,
    # Found module with too many imports
    WPS201,
    # Found using `@staticmethod`
    WPS602,
    # Requests call with verify=False disabling SSL certificate checks, security issue
    S501,
    # Found too long ``try`` body length
    WPS229,
    # line break before binary operator
    W503,
    # Found a too complex `f` string
    WPS237,
    # Found a getter without a return value
    WPS463,
    # Found subclassing a builtin: str
    WPS600,
    # Do not perform function calls in argument defaults. This rule prevents us from using the recommended style of dependency_injector
    B008,
    # Found too many arguments
    WPS211,
    # Found complex default value
    WPS404,
    # Found nested class: Config
    WPS431,
    # Found too many expressions
    WPS213,
    # Found upper-case constant in a class
    WPS115,
    # Found executable mismatch: file is executable but no shebang is present
    WPS453,
    # Found private name pattern
    WPS112,
    # Found incorrect node inside `class` body
    WPS604,
    # Found wrong keyword: pass
    WPS420,
    # Found nested function
    WPS430,
    # Found overused expression
    WPS204,
    # String formatting
    WPS323
	# used; unable to detect undefined names
    F403,  
	# Found vague import that may cause confusion: *
    WPS347,
	# Found block variables overlap: *
    WPS440, 

allowed-domain-names =
    info,    # We use it in settings
    content, # We allow to use 'content' name when retrieving file content
    value,   # We allow using 'value' name when creating dictionaries
    result,  # We allow to use 'result' name when getting function result
    data,    # We use name 'data' in our models
    params,  # We allow using 'params' when storing parameters


exclude =
    .git,
    __pycache__,
    tests,
    vendors,
    .venv,
    etc

per-file-ignores =
  # There are multiple `assert`s in tests, we allow them:
  src/tests/*.py: S101
  */__init__.py: F401
  */settings.py: WPS425
  */app.py: WPS433
  */celery_app.py: WPS433
  */infrastructure/heuristic/utils.py: WPS100, WPS232, WPS202
  */infrastructure/heuristic/columns_detection.py: WPS232, E800, WPS220
  */infrastructure/heuristic/image_processing.py: WPS232, WPS432
  */infrastructure/heuristic/rows_detection.py: WPS432
  */infrastructure/bbox_identifiers/cell_border_identifier.py: WPS432
  */extras/auth/deps_auth.py: WPS326, WPS503
  */extras/auth/exceptions.py: N818
  */extras/ocr/*: WPS358, F401

max-local-variables = 15
max-methods = 10
max-line-length = 130
max-line-complexity = 20
max-module-members = 10
max-module-expressions = 10

# radon section
radon-max-cc = 10
radon-show-closures = True
radon-no-assert = True

[mypy]
ignore_missing_imports = True
follow_imports = skip
follow_imports_for_stubs = False
cache_dir = /tmp/test_cache/.mypy_cache
strict_optional = False
disable_error_code = attr-defined, name-defined


[isort]
profile = black
multi_line_output = 3
skip =
    vendors
    etc
    .venv


[coverage:run]
omit =
    tests/*
    */__init__.py
    /vendors/*
    deps_tables/domain/interfaces.py
    deps_tables/domain/entities.py
    deps_tables/domain/constants.py
    deps_tables/web.py
    deps_tables/containers.py
    deps_tables/settings.py
    deps_tables/__main__.py
    /app/.venv/*
branch = True
data_file=/tmp/test_cache/.coverage

[coverage:report]
fail_under = 83

[ipdb]
context = 21
